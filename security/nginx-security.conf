# Include inside your server { } block. Report-Only first, then enforce.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self' https://wa.me; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header X-Frame-Options "DENY" always;
gzip on; gzip_types text/css application/javascript application/json image/svg+xml application/xml;
location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
error_page 404 /404.html;
types { application/javascript mjs; }
location ~ /\.(git|env) { deny all; return 404; }
